name: BlockWill - Build custom images

# Builds our patched Plane images and pushes them to GHCR whenever the
# `blockwill` branch changes. vm-jarvis polls GHCR for the `blockwill` tag
# (systemd timer in plane-deploy) and redeploys automatically, so a push to
# this branch is all that's needed to ship a change to plane.blockwill.io.
#
# Built images: web (plane-frontend) and api (plane-backend). Add jobs
# mirroring these for space/admin if we ever patch those apps.
#
# Both jobs run in the `production` environment, whose deployment-branch rule
# only admits `blockwill`. A manual run from any other branch is refused before
# it can push the `:blockwill` tag; an `if:` here would not be enough, because
# the other branch would bring its own copy of this file.

on:
  push:
    branches:
      - blockwill
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Signed build provenance (PLAT-26): the OIDC token proves which workflow
  # and branch built the image; vm-jarvis checks it before deploying.
  id-token: write
  attestations: write

concurrency:
  group: blockwill-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_web:
    name: Build & push web (plane-frontend)
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockwill-io/plane-frontend:blockwill
            ghcr.io/blockwill-io/plane-frontend:blockwill-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/blockwill-io/plane-frontend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build_api:
    name: Build & push api (plane-backend)
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockwill-io/plane-backend:blockwill
            ghcr.io/blockwill-io/plane-backend:blockwill-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/blockwill-io/plane-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
