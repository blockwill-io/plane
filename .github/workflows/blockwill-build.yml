name: BlockWill - Build custom images

# Builds our patched Plane images and pushes them to GHCR whenever the
# `blockwill` branch changes. vm-jarvis polls GHCR for the `blockwill` tag
# (systemd timer in plane-deploy) and redeploys automatically, so a push to
# this branch is all that's needed to ship a change to plane.blockwill.io.
#
# Only the frontend (web) image is built for now — add jobs mirroring
# `build_web` for space/admin/api if we ever patch those apps.

on:
  push:
    branches:
      - blockwill
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blockwill-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_web:
    name: Build & push web (plane-frontend)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockwill-io/plane-frontend:blockwill
            ghcr.io/blockwill-io/plane-frontend:blockwill-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
