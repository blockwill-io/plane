name: BlockWill - Watch upstream releases

# Checks daily whether makeplane has published a new Plane or plane-mcp-server
# release. When one appears, opens an issue in this fork (which emails everyone
# watching the repo) — one issue per release tag, never duplicated.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    name: Check upstream releases
    runs-on: ubuntu-22.04
    steps:
      - name: Compare latest upstream releases against open/closed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          check_repo() {
            local upstream="$1" label="$2"
            local tag url
            tag=$(gh api "repos/${upstream}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
            [ -z "$tag" ] && { echo "${upstream}: no releases"; return 0; }
            url=$(gh api "repos/${upstream}/releases/latest" --jq '.html_url')
            local title="Upstream release: ${upstream} ${tag}"
            if gh issue list -R "${GITHUB_REPOSITORY}" --state all --search "\"${title}\" in:title" --json title --jq '.[].title' | grep -qFx "$title"; then
              echo "${upstream} ${tag}: already reported"
            else
              gh issue create -R "${GITHUB_REPOSITORY}" \
                --title "$title" \
                --body "New upstream release for \`${upstream}\`: [\`${tag}\`](${url})

To pick it up in the fork:
\`\`\`
git fetch upstream --tags
git checkout blockwill
git merge ${tag}   # resolve conflicts only if upstream touched our seam files
git push           # CI rebuilds, vm-jarvis auto-deploys within 5 min
\`\`\`
For Plane releases, also bump \`APP_RELEASE\` in plane-deploy's \`variables.env\` for the non-forked services (space/admin/live/proxy).
For plane-mcp-server releases, redeploy with:
\`\`\`
az containerapp update -n ca-plane-mcp -g rg-mcp-plane --image ghcr.io/blockwill-io/plane-mcp-server:blockwill
\`\`\`
_Opened automatically by the upstream-watch workflow (${label})._"
              echo "${upstream} ${tag}: issue opened"
            fi
          }
          check_repo "makeplane/plane" "plane"
          check_repo "makeplane/plane-mcp-server" "mcp"
